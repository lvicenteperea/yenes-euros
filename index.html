<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><link rel="manifest" href="./manifest.webmanifest"><title>Yenes a euros</title><style>body{font-family:system-ui;margin:0;background:#f4f6fb;color:#172554}main{max-width:440px;margin:45px auto;padding:24px}h1{font-size:27px}label{display:block;margin-top:25px;font-weight:600}input{box-sizing:border-box;width:100%;font-size:32px;padding:15px;border:2px solid #94a3b8;border-radius:14px;margin-top:8px}#result{font-size:42px;font-weight:750;margin:25px 0}small{color:#475569}button{border:0;background:#172554;color:white;padding:13px;border-radius:10px;font-size:16px}</style></head><body><main><h1>🇯🇵 Yenes → Euros 🇪🇺</h1><label for="yen">Cantidad en yenes (¥)</label><input id="yen" type="number" min="0" step="1" inputmode="decimal" placeholder="1000"><div id="result">— €</div><p id="status" aria-live="polite">Cargando tipo de cambio…</p><button id="refresh">Actualizar cambio</button><p><small>Tipo de cambio orientativo, sin comisiones bancarias.</small></p></main><script>const yen=document.querySelector("#yen"),result=document.querySelector("#result"),status=document.querySelector("#status");let rate=null;try{const saved=JSON.parse(localStorage.getItem("fxJPYEUR")||"null");if(saved&&Number.isFinite(saved.rate)){rate=saved.rate;status.textContent="Último cambio guardado: "+saved.date;render()}}catch(e){}function render(){const n=Number(yen.value);result.textContent=yen.value!==""&&Number.isFinite(n)&&n>=0&&rate!==null?(n*rate).toLocaleString("es-ES",{style:"currency",currency:"EUR"}):"— €"}yen.addEventListener("input",render);async function update(){status.textContent="Actualizando cambio…";try{const response=await fetch("https://api.frankfurter.dev/v1/latest?base=JPY&symbols=EUR",{cache:"no-store"});if(!response.ok)throw Error("HTTP");const data=await response.json();if(!Number.isFinite(data.rates?.EUR))throw Error("Tipo no válido");rate=data.rates.EUR;localStorage.setItem("fxJPYEUR",JSON.stringify({rate,date:data.date}));status.textContent="Cambio de referencia: "+data.date+" · 1 ¥ = "+rate.toFixed(6)+" €";render()}catch(e){status.textContent=rate===null?"Sin conexión: conecta a Internet para obtener el primer cambio.":"Sin conexión: usando el último cambio guardado."}}document.querySelector("#refresh").addEventListener("click",update);update();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});</script></body></html>
